<!DOCTYPE html>
<html lang="pt-pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        
        <title>Meu Perfil - Clínica Dr. Machado Lemos</title>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/perfil.css">  
    </head>
    <body>
        <div class="dashboard-container">
            <aside class="sidebar">
                    <div class="user-profile">
                        <div class="avatar-circle" id="sidebar-avatar">--</div>
                        <h3 id="nome-medico">A carregar...</h3>
                        <span class="user-role">Profissional de Saúde</span>
                    </div>
            
            <nav>
                <ul>
                    <li>
                        <a href="consultas.html" class="nav-btn">
                            <i class="fa-solid fa-calendar-check"></i> Consultas
                        </a>
                    </li>
                    <li>
                        <a href="lista_prescricoes.html" class="nav-btn">
                            <i class="fa-solid fa-file-prescription"></i> Prescrições
                        </a>
                    </li>
                    <li>
                        <a href="utente.html" class="nav-btn">
                            <i class="fa-solid fa-users"></i> Utentes
                        </a>
                    </li>
                    <li>
                        <a href="perfil.html" class="nav-btn active">
                            <i class="fa-solid fa-user-doctor"></i> Perfil
                        </a>
                    </li>
                </ul>
            </nav>
            
            <button class="logout-btn" onclick="terminarSessao()">Terminar Sessão</button>
        </aside>

            <main class="main-content">
                <header class="header-banner">
                    <div class="titulo-e-acao">
                        <h1 id="page-title">Meu Perfil</h1>
                        <p class="subtitle" id="boas-vindas">Informações da conta</p>
                    </div>
                </header>

                <section class="content-area">
                    <div class="profile-card">
                        <div class="profile-header-section">
                            <div class="big-avatar">
                                <span class="initials" id="profile-initials">--</span>
                            </div>
                            <h2 id="profile-name-display">--</h2>
                            <span class="badge-prof">Especialista</span>
                        </div>

                        <hr class="divider">

                        <div class="profile-info-grid">
                            <div class="form-group">
                                <label>Nome Completo</label>
                                <input type="text" id="input-nome" readonly class="input-readonly">
                            </div>
                            <div class="form-group">
                                <label>Email Corporativo</label>
                                <input type="email" id="input-email" readonly class="input-readonly">
                            </div>
                            <div class="form-group">
                                <label>Nº Cédula Profissional</label>
                                <input type="text" id="input-licenca" readonly class="input-readonly">
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
        <script src="js/auth.js" defer></script>
        <script src="js/perfil.js" defer></script>
    </body> 
</html>
