<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Utentes - Clínica</title>
    <link rel="stylesheet" href="css/utente.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="user-profile">
                <div class="avatar-circle" id="sidebar-avatar">--</div>
                <h3 id="nome-medico">A carregar...</h3>
                <span class="user-role">Profissional de Saúde</span>
            </div>
            <nav>
                <ul>
                    <li><a href="consultas.html" class="nav-btn"><i class="fa-solid fa-calendar-check"></i> Consultas</a></li>
                    <li><a href="lista_prescricoes.html" class="nav-btn"><i class="fa-solid fa-file-prescription"></i> Prescrições</a></li>
                    <li><a href="utente.html" class="nav-btn active"><i class="fa-solid fa-users"></i> Utentes</a></li>
                    <li><a href="perfil.html" class="nav-btn"><i class="fa-solid fa-user-doctor"></i> Perfil</a></li>
                </ul>
            </nav>
            <button class="logout-btn" onclick="terminarSessao()">Terminar Sessão</button>
        </aside>

        <main class="main-content">
            <header class="header-banner">
                <h1>Lista de Utentes</h1>
                <div class="search-wrapper">
                    <input type="text" id="inputPesquisa" placeholder="Pesquisar por Nome ou SNS...">
                </div>
            </header>

            <div id="utentesList" class="utentes-container">
                <p style="text-align:center; color:white;">A carregar lista...</p>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalUtente">
        <div class="modal-card">
            
            <button class="close-btn" onclick="fecharModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="modal-content-scroll">
                
                <div class="modal-header-utente">
                    <h2 id="m-nome">--</h2>
                    <div class="badges-container">
                        <span id="m-sns-badge" class="badge badge-info">SNS: --</span>
                        <span id="m-idade-badge" class="badge badge-warning">-- Anos</span>
                    </div>
                </div>

                <div class="action-buttons-grid">
                    <button class="btn-action btn-receita" onclick="irParaPrescricao()">
                        <i class="fa-solid fa-file-prescription"></i> Nova Receita
                    </button>
                    
                    <button class="btn-action btn-historico" onclick="irParaHistorico()">
                        <i class="fa-solid fa-clock-rotate-left"></i> Registo Histórico
                    </button>
                </div>

                <h4 class="section-title"><i class="fa-regular fa-id-card"></i> Dados Pessoais</h4>
                <div class="info-grid">
                    <div class="info-box"><label>Telemóvel</label><span id="m-telemovel">--</span></div>
                    <div class="info-box"><label>Email</label><span id="m-email">--</span></div>
                    <div class="info-box"><label>Sexo</label><span id="m-sexo">--</span></div>
                    <div class="info-box"><label>Sangue</label><span id="m-sangue">--</span></div>
                </div>

                <h4 class="section-title"><i class="fa-solid fa-triangle-exclamation"></i> Alergias</h4>
                <div id="lista-alergias" class="list-container"></div>

                <h4 class="section-title"><i class="fa-solid fa-heart-pulse"></i> Problemas Clínicos</h4>
                <div id="lista-problemas" class="list-container"></div>

                <h4 class="section-title"><i class="fa-solid fa-pills"></i> Histórico Terapêutico</h4>
                <div id="lista-medicacao" class="list-container"></div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/utentes.js"></script>
</body>
</html>
