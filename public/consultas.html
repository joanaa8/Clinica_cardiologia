<!DOCTYPE html>
<html lang="pt-pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Consultas - Clínica Dr. Machado Lemos</title>
        <link rel="stylesheet" href="css/consultas.css">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <link rel="stylesheet" href="https://npmcdn.com/flatpickr/dist/themes/material_blue.css">
    </head>
    <body>

        <div class="dashboard-container">
            <aside class="sidebar">
    <div class="user-profile">
        <div class="avatar-circle" id="sidebar-avatar">--</div>
        <h3 id="nome-medico">A carregar...</h3>
        <span class="user-role">Profissional de Saúde</span>
    </div>

    <nav>
        <ul>
            <li>
                <a href="consultas.html" class="nav-btn active">
                    <i class="fa-solid fa-calendar-check"></i> Consultas
                </a>
            </li>

            <li>
                <a href="lista_prescricoes.html" class="nav-btn">
                    <i class="fa-solid fa-file-prescription"></i> Prescrições
                </a>
            </li>

            <li>
                <a href="utente.html" class="nav-btn">
                    <i class="fa-solid fa-users"></i> Utentes
                </a>
            </li>

            <li>
                <a href="perfil.html" class="nav-btn">
                    <i class="fa-solid fa-user-doctor"></i> Perfil
                </a>
            </li>
        </ul>
    </nav>
    <button class="logout-btn" onclick="terminarSessao()">Terminar Sessão</button>
</aside>

            <div class="main-content">
                <div class="header-banner">
                    <h1>Consultas</h1>
                    <div class="sort-wrapper">
                        <label for="statusDropdown">Filtrar:</label>
                        <select id="statusDropdown" name="filtro_consultas" onchange="carregarConsultas()">
                            <option value="proximas" selected>Próximas</option>
                            <option value="passadas">Passadas</option>
                            <option value="canceladas">Canceladas</option>
                        </select>
                    </div>
                </div>

                <div class="consultas-container">
                    <div id="consultasList" class="lista-scroll"></div>
                </div>
            </div>
        </div>

        <!-- Modal -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-card modal-large">
                <button class="close-btn" onclick="fecharModal()">&times;</button>
                
                <div class="header-modal">
                    <div class="avatar-circle" id="m-avatar">--</div>
                    <div class="header-info">
                        <div class="name-row">
                            <h2 id="m-paciente">Nome do Paciente</h2>
                            <span class="status-badge" id="m-status">--</span>
                        </div>
                    </div>
                </div>

                <hr class="divider">

                <div class="info-grid two-columns">
                    <div class="info-box">
                        <strong>Data</strong>
                        <p id="m-data-so">--/--/----</p>
                    </div>
                    <div class="info-box">
                        <strong>Hora</strong>
                        <p id="m-hora">--:--</p>
                    </div>
                    <div class="info-box">
                        <strong>SNS</strong>
                        <p id="m-sns">--</p>
                    </div>
                    <div class="info-box">
                        <strong>Telemóvel</strong>
                        <p id="m-telemovel">--</p>
                    </div>
                </div>

                <div class="modal-footer-centered">
                    <div id="calendar-inline-container"></div>
                    <button class="btn-reagendar" id="btnreagendarConsulta">Reagendar Consulta</button>
                    
                    <button class="btn-confirm" id="btnConfirmarData" style="display: none;">Confirmar Nova Data</button>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
        <script src="js/auth.js" defer></script>
        <script src="js/appointment.js" defer></script>

    </body>
</html>
