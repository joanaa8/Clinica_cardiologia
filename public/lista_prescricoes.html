<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Minhas Prescrições</title>
    <link rel="stylesheet" href="css/prescricoes.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="user-profile">
                <div class="avatar-circle" id="sidebar-avatar">--</div>
                <h3 id="nome-medico">A carregar...</h3>
                <span class="user-role">Profissional de Saúde</span>
            </div>
            <nav>
                <ul>
                    <li><a href="consultas.html" class="nav-btn"><i class="fa-solid fa-calendar-check"></i> Consultas</a></li>
                    <li><a href="lista_prescricoes.html" class="nav-btn active"><i class="fa-solid fa-file-prescription"></i> Prescrições</a></li>
                    <li><a href="utente.html" class="nav-btn"><i class="fa-solid fa-users"></i> Utentes</a></li>
                    <li><a href="perfil.html" class="nav-btn"><i class="fa-solid fa-user-doctor"></i> Perfil</a></li>
                </ul>
            </nav>
            <button class="logout-btn" onclick="terminarSessao()">Terminar Sessão</button>
        </aside>

        <main class="main-content">
            <div class="header-banner">
    <h1>Minhas Prescrições</h1>
    
    <div style="display:flex; gap:15px; align-items:center;">
        
        <a href="prescricoes.html" class="btn-primary" style="text-decoration:none; display:flex; align-items:center; gap:8px;">
            <i class="fa-solid fa-plus"></i> Nova Receita
        </a>

        <div class="sort-wrapper">
            <select id="filtroPrescricoes" onchange="aplicarFiltro()" style="padding: 10px; border-radius: 12px; border: 1px solid #ccc; cursor:pointer; outline:none;">
                <option value="recent">Mais Recentes</option>
                <option value="expiring">Quase a Expirar</option>
                <option value="inactive">Inativos / Histórico</option>
            </select>
        </div>

        <div class="search-wrapper">
            <input type="text" id="inputPesquisa" placeholder="Pesquisar..." style="padding: 10px 15px; border-radius: 12px; border: 1px solid #ddd; outline: none;">
        </div>
    </div>
</div>

            <div class="content-card">
                <table id="tabela-prescricoes">
                    <thead>
                        <tr>
                            <th style="width: 20%;">Utente</th>
                            <th>Medicamentos</th>
                            <th>Data</th>
                            <th>Nº Receita</th>
                            <th>Estado</th>
                            <th style="text-align:center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="6" style="text-align:center; padding:30px;">A carregar dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modal-detalhes" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header-clean">
                <h2>Detalhes da Prescrição</h2>
                <button class="close-btn-clean" onclick="fecharModalDetalhes()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div id="modal-content">
                <p style="text-align:center; color:#888;">A carregar informações...</p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/lista_prescricoes.js"></script>
</body>
</html>
