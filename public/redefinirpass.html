<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Redefinir Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div id="login-screen">
            <div class="login-card">
                
                <h1>Redefinir Password</h1>
                <form id="reset-form" onsubmit="redefinirPassword(event)">
                <input type="hidden" id="email" name="email">
                <label for="nova_password">Nova Password:</label><br>
                <input type="password" id="nova_password" name="nova_password" required><br><br>
                <label for="confirmar_password">Confirmar Password:</label><br>
                <input type="password" id="confirmar_password" name="confirmar_password" required><br><br>
                <input type="submit" value="Redefinir">
                </form>
            </div>
        <p><a href="index.html">Voltar ao login</a></p>
    </div>
  <script src="js/redefinir.js"></script>
</body>
</html>
