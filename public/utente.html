<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utentes - Clínica Dr. Machado Lemos</title>
    <link rel="stylesheet" href="css/utente.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div class="dashboard-container">
            <aside class="sidebar">
                <div class="user-profile">
                    <div class="avatar-circle" id="sidebar-avatar">--</div>
                    <h3 id="nome-medico">A carregar...</h3>
                    <span class="user-role">Profissional de Saúde</span>
                </div>
        
                <nav>
                    <ul>
                        <li>
                            <a href="consultas.html" class="nav-btn">
                                <i class="fa-solid fa-calendar-check"></i> Consultas
                            </a>
                        </li>
                        <li>
                            <a href="lista_prescricoes.html" class="nav-btn">
                                <i class="fa-solid fa-file-prescription"></i> Prescrições
                            </a>
                        </li>
                        <li>
                            <a href="utente.html" class="nav-btn active">
                                <i class="fa-solid fa-users"></i> Utentes
                            </a>
                        </li>
                        <li>
                            <a href="perfil.html" class="nav-btn">
                                <i class="fa-solid fa-user-doctor"></i> Perfil
                            </a>
                        </li>
                    </ul>
                </nav>
        
            <button class="logout-btn" onclick="terminarSessao()">Terminar Sessão</button>
        </aside>

        <main class="main-content">
            <header class="header-banner">
                <h1>Lista de Utentes</h1>
                <div class="search-wrapper">
                    <input type="text" id="inputPesquisa" placeholder="Pesquisar utentes...">
                </div>
            </header>

            <div id="utentesList" class="utentes-container">
                <p style="text-align:center; margin-top:20px;">A carregar lista...</p>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalUtente">
        <div class="modal-card">
            <button class="close-btn" onclick="fecharModal()">&times;</button>
            
            <div class="header-modal">
                <div class="avatar-circle" id="m-avatar">--</div>
                <h3 id="m-nome">--</h3>
            </div>

            <hr class="divider">

            <div class="info-grid">
                <div class="info-box"><strong>SNS:</strong> <p id="m-sns">--</p></div>
                <div class="info-box"><strong>Nascimento:</strong> <p id="m-dataNasc">--</p></div>
                <div class="info-box"><strong>Sexo:</strong> <p id="m-sexo">--</p></div>
                <div class="info-box"><strong>Telemóvel:</strong> <p id="m-telemovel">--</p></div>
            </div>

            <h4 class="section-title">Alergias</h4>
            <div class="notes-box">
                <p id="m-obsAlergias">--</p>
            </div>
            
            </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/utentes.js"></script>

</body>
</html>
