<!DOCTYPE html>
<html lang="pt">

    <head>

        <meta charset="UTF-8">
        <title>Redefinir Password</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/index.css">
    
    </head>

    <body>

        <div id="login-screen">

            <div class="login-card">
                <h1>Redefinir Password</h1>

                <form onsubmit="redefinirPassword(event)">
                    <input type="hidden" id="token">

                    <div class="input-group">
                        <label for="nova_password">Nova Password</label>
                        <input type="password" id="nova_password" required>
                    </div>

                    <div class="input-group">
                        <label for="confirmar_password">Confirmar Password</label>
                        <input type="password" id="confirmar_password" required>
                    </div>

                    <button type="submit" class="login-button">Redefinir</button>
                </form>

                <div id="message" class="role-hint"></div>
                <p><a href="index.html" class="recovery-link">Voltar ao login</a></p>
           
            </div>
       
        </div>

        
        <script src="js/redefinir.js"></script>
    </body>
    
</html>
