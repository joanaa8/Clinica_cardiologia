<!DOCTYPE html>
<html lang="pt-pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>Dashboard Profissional - Clínica Dr. Machado Lemos</title>
        <link rel="stylesheet" href="css/prof.css">
    </head>

    <body>
        <div class="dashboard-container">
            <aside class="sidebar">
                <div class="sidebar-top">
                    <a href="profissional.html" class="user-profile-link">
                        <div class="user-profile">
                            <div class="avatar-circle" id="sidebar-avatar"></div>
                            <div class="user-info-text">
                                <h3 id="nome-medico">A carregar...</h3>
                                <span class="user-role">Profissional de Saúde</span>
                            </div>
                        </div>
                    </a>
                    <nav>
                        <ul>
                            <li><a href="consultas.html" class="nav-btn"><span class="icon-dot"></span> Consultas</a></li>
                            <a href="lista_prescricoes.html" class="nav-btn">...</a>
                            <li><a href="utente.html" class="nav-btn"><span class="icon-dot"></span> Utentes</a></li>
                            <li><a href="perfil.html" class="nav-btn"><span class="icon-dot"></span> Perfil</a></li>
                        </ul>
                    </nav>
                </div>
                <button class="logout-btn" onclick="terminarSessao()">Terminar Sessão</button>
            </aside>

            <main class="main-content">
                    <header class="header-banner">
                        <div class="titulo-e-acao">
                            <h1 id="page-title">Bem-vindo</h1> 
                            <p class="subtitle" id="boas-vindas"></p>
                        </div>
                        <div class="header-actions">
                            </div>
                    </header>

                    <section class="content-area">
                        <div class="calendar-column">
                            <div class="calendar-card">
                                <div id="calendar"></div>
                            </div>
                        </div>
                    </section>
            </main>
           
        </div>
            <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
            <script src="js/auth.js"></script>
            <script src="js/prof.js"></script>
    </body>
</html>
