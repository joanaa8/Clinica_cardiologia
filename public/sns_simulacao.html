<!DOCTYPE html>
<html lang="pt">

    <head>
        <meta charset="UTF-8">                                                                  <!--serve para permitir acentos-->
        <meta http-equiv="X-UA-Compatible" content="IE-edge">                                   <!--compatibilidade com dispositivos de telemovel-->
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">  <!--controlo da tela, tag responsiva-->
        <title>Minhas Prescrições - SNS</title>
        <link rel="stylesheet" href="css/sns_simulacao.css"> 
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> 
        
    </head>

    <body>

        <div class="main-container">
        
        <div class="card-id">
            <div class="campo-id">Nome do utente:<span id="nome-exigibido"></span></div>
            <div class="campo-id">Número de saúde:<span id="n_saude-exibido"></span></div>
        </div>

        <h2 class="titulo-pagina">Receitas</h2>

        <div  id="lista-receitas"></div>

        <div class="filtros">
            <button class="btn-filtro ativo">Todas</button>
            <button class="btn-filtro">Ativas</button>
        </div>

        <div class="seccao-info">Últimos 12 meses</div>
        <p></p>

        <div class="receita-card">
            <div class="receita-nome"></div>
            <span class="status-tag"></span>
            <div class="receita-detalhes">
                
            </div>
        </div>

    </div>



    <script src="js/sns_simulacao.js"></script>
    </body>
    
</html>
