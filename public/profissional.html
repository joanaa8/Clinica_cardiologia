<!DOCTYPE html>
<html lang="pt-pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>Dashboard Profissional - Clínica Dr. Machado Lemos</title>
        <link rel="stylesheet" href="css/perfil.css">
         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_blue.css">
    </head>

    <body>
        <div class="dashboard-container">

      
            <aside class="sidebar">
                <div class="sidebar-top">
                        <div class="user-profile">
                            <div class="avatar-circle" id="sidebar-avatar"></div>
                            <div class="user-info-text">
                                <h3 id="nome-medico">A carregar...</h3>
                                <span class="user-role">Profissional de Saúde</span>
                            </div>
                        </div>
                    </a>

                    <nav>
                        <ul>
                            <li><a href="consultas.html" class="nav-btn"><span class="icon-dot"></span> Consultas</a></li>
                            <li><a href="prescricoes.html" class="nav-btn"><span class="icon-dot"></span> Prescrições</a></li>
                            <li><a href="utente.html" class="nav-btn"><span class="icon-dot"></span> Utentes</a></li>
                            <li><a href="perfil.html" class="nav-btn"><span class="icon-dot"></span> Perfil</a></li>
                        </ul>
                    </nav>
                </div>

                <button class="logout-btn" onclick="terminarSessao()">Terminar Sessão</button>
            </aside>


            <main class="main-content">

                <header class="header-banner">
                    <div class="header-wrapper">
                        <div class="titulo-e-acao">
                            <h1>Dashboard</h1>
                            <p class="subtitle">Resumo da atividade profissional</p>
                        </div>
                    </div>
                </header>

                <div class="content-area">

                   
                    <div class="cards-grid">

                        <div class="info-card">
                            <h3>Consultas Hoje</h3>
                            <p class="card-number">5</p>
                        </div>

                        <div class="info-card">
                            <h3>Utentes Ativos</h3>
                            <p class="card-number">42</p>
                        </div>

                        <div class="info-card">
                            <h3>Prescrições Ativas</h3>
                            <p class="card-number">18</p>
                        </div>

                    </div>

                </div>
            </main>
        </div>
        <script src="js/auth.js"></script>
    </body>
</html>
